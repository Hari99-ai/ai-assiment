apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: amrutam}
spec:
  replicas: 2
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      serviceAccountName: amrutam
      terminationGracePeriodSeconds: 75
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: REPLACE_WITH_REGISTRY/amrutam:REPLACE_WITH_COMMIT_SHA
          command: [celery, -A, app.workers.tasks.celery, worker, --loglevel=WARNING, --concurrency=2]
          env:
            - {name: ENVIRONMENT, value: production}
            - {name: REDIS_REQUIRED, value: 'true'}
          envFrom: [{secretRef: {name: amrutam-secrets}}]
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: '1', memory: 768Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: beat, namespace: amrutam}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: beat}}
  template:
    metadata: {labels: {app: beat}}
    spec:
      serviceAccountName: amrutam
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: beat
          image: REPLACE_WITH_REGISTRY/amrutam:REPLACE_WITH_COMMIT_SHA
          command: [celery, -A, app.workers.tasks.celery, beat, --loglevel=WARNING, --schedule=/tmp/celerybeat]
          env:
            - {name: ENVIRONMENT, value: production}
            - {name: REDIS_REQUIRED, value: 'true'}
          envFrom: [{secretRef: {name: amrutam-secrets}}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 250m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
