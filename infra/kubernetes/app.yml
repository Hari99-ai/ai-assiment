apiVersion: v1
kind: Namespace
metadata:
  name: amrutam
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: amrutam, namespace: amrutam}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: amrutam}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata: {labels: {app: api}}
    spec:
      serviceAccountName: amrutam
      terminationGracePeriodSeconds: 45
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: REPLACE_WITH_REGISTRY/amrutam:REPLACE_WITH_COMMIT_SHA
          ports: [{containerPort: 8000}]
          env:
            - {name: ENVIRONMENT, value: production}
            - {name: REDIS_REQUIRED, value: 'true'}
          envFrom: [{secretRef: {name: amrutam-secrets}}]
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: '1', memory: 768Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /health/ready, port: 8000}, periodSeconds: 10, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /health/live, port: 8000}, periodSeconds: 15, timeoutSeconds: 3}
          startupProbe: {httpGet: {path: /health/live, port: 8000}, failureThreshold: 30, periodSeconds: 2}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: amrutam}
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api, namespace: amrutam}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api, namespace: amrutam}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: api}}
---
apiVersion: batch/v1
kind: Job
metadata: {name: migrate-REPLACE_WITH_COMMIT_SHA, namespace: amrutam}
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: REPLACE_WITH_REGISTRY/amrutam:REPLACE_WITH_COMMIT_SHA
          command: [alembic, upgrade, head]
          envFrom: [{secretRef: {name: amrutam-migration-secrets}}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
