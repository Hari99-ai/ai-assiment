[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "amrutam-telemedicine-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0.36,<2.1",
 "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "redis>=5.2,<7",
 "celery>=5.4,<6", "pydantic-settings>=2.6,<3", "email-validator>=2.2,<3",
 "argon2-cffi>=23.1", "PyJWT>=2.10,<3", "pyotp>=2.9,<3",
 "cryptography>=44", "prometheus-client>=0.21,<1", "httpx>=0.28,<1",
 "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
 "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
 "opentelemetry-instrumentation-sqlalchemy>=0.51b0,<1",
 "opentelemetry-instrumentation-redis>=0.51b0,<1",
 "opentelemetry-instrumentation-celery>=0.51b0,<1",
 "opentelemetry-instrumentation-httpx>=0.51b0,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "hypothesis>=6,<7", "ruff>=0.11,<1", "mypy>=1.15,<2", "pip-audit>=2.8,<3", "types-redis", "types-PyYAML", "PyYAML>=6,<7"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and Redis"]
