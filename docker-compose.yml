name: amrutam
x-app: &app
  build: .
  environment: &environment
    DATABASE_URL: postgresql+psycopg://amrutam:local-development@postgres:5432/amrutam
    REDIS_URL: redis://redis:6379/0
    REDIS_REQUIRED: 'true'
    JWT_SECRET: ${JWT_SECRET:-development-only-change-this-secret-before-deploying}
    WEBHOOK_SECRET: ${WEBHOOK_SECRET:-development-only-webhook-secret}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    OTEL_ENDPOINT: http://jaeger:4318
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: amrutam
      POSTGRES_PASSWORD: local-development
      POSTGRES_DB: amrutam
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U amrutam]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7.4.5-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    restart: 'no'
  api:
    <<: *app
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    <<: *app
    command: [celery, -A, app.workers.tasks.celery, worker, --loglevel=WARNING, --concurrency=2]
    depends_on:
      migrate: {condition: service_completed_successfully}
  beat:
    <<: *app
    command: [celery, -A, app.workers.tasks.celery, beat, --loglevel=WARNING, --schedule=/tmp/celerybeat]
    depends_on:
      migrate: {condition: service_completed_successfully}
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ['127.0.0.1:9090:9090']
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes: [./infra/monitoring/grafana:/etc/grafana/provisioning:ro]
    ports: ['127.0.0.1:3000:3000']
  jaeger:
    image: jaegertracing/all-in-one:1.71.0
    environment: {COLLECTOR_OTLP_ENABLED: 'true'}
    ports: ['127.0.0.1:16686:16686']
  tests:
    <<: *app
    profiles: [test]
    volumes: ['./tests:/srv/app/tests:ro']
    environment:
      <<: *environment
      TEST_DATABASE_URL: postgresql+psycopg://amrutam:local-development@postgres:5432/amrutam_test
      TEST_REDIS_URL: redis://redis:6379/15
      HYPOTHESIS_STORAGE_DIRECTORY: /tmp/hypothesis
    command: [pytest, -q, -p, no:cacheprovider]
volumes:
  postgres-data:
  redis-data:
