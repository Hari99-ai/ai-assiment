name: backend
on: [push, pull_request]
permissions: {contents: read}
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env: {POSTGRES_USER: amrutam, POSTGRES_PASSWORD: test-password, POSTGRES_DB: amrutam_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U amrutam" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4.5-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://amrutam:test-password@localhost:5432/amrutam_test
      TEST_DATABASE_URL: postgresql+psycopg://amrutam:test-password@localhost:5432/amrutam_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff format --check app tests scripts && ruff check app tests scripts
      - run: mypy app
      - run: python -m scripts.validate_artifacts
      - run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
      - run: pytest --cov=app --cov-report=xml -q
      - run: pip-audit -r requirements.lock
      - run: docker build -t amrutam:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@0.33.1
        with: {image-ref: 'amrutam:${{ github.sha }}', severity: 'CRITICAL,HIGH', exit-code: '1', ignore-unfixed: true}
      - uses: actions/upload-artifact@v4
        with: {name: coverage, path: coverage.xml}
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform fmt -check && terraform -chdir=infra/terraform init -backend=false && terraform -chdir=infra/terraform validate
      - run: GRAFANA_PASSWORD=ci-only-validation docker compose config --quiet
